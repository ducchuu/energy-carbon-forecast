name: dbt Hourly Run

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'dbt target environment (dev or prod)'
        required: false
        default: 'dev'

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: dbt Build
        run: dbt build --target ${{ inputs.target || vars.DBT_TARGET || 'dev' }}
        working-directory: dbt_energy
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DBT_TARGET: ${{ inputs.target || vars.DBT_TARGET || 'dev' }}
          DBT_ENV_SUFFIX: ${{ inputs.target || vars.DBT_ENV_SUFFIX || 'dev' }}
          BQ_DATASET_BRONZE: ${{ vars.BQ_DATASET_BRONZE || format('energy_bronze_{0}', inputs.target || vars.DBT_ENV_SUFFIX || 'dev') }}
          BQ_DATASET_SILVER: ${{ vars.BQ_DATASET_SILVER || format('energy_silver_{0}', inputs.target || vars.DBT_ENV_SUFFIX || 'dev') }}
          BQ_DATASET_GOLD: ${{ vars.BQ_DATASET_GOLD || format('energy_gold_{0}', inputs.target || vars.DBT_ENV_SUFFIX || 'dev') }}
