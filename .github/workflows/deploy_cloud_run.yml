name: Deploy Dashboard to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Docker auth'
        run: |-
          gcloud auth configure-docker europe-west4-docker.pkg.dev

      - name: Build and Push Container
        working-directory: dashboard
        run: |
          DOCKER_TAG="europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/energy-pipeline-containers/dashboard:${{ github.sha }}"
          docker build -t $DOCKER_TAG .
          docker push $DOCKER_TAG

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy energy-optimizer-dashboard \
            --image="europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/energy-pipeline-containers/dashboard:${{ github.sha }}" \
            --region="europe-west4" \
            --service-account="${{ secrets.UI_SERVICE_ACCOUNT }}" \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=80 \
            --cpu=1 \
            --memory=512Mi \
            --cpu-boost \
            --update-env-vars="GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}"
